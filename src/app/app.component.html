<html>
<head>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Bree Serif">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
  <a class="navbar-brand" routerLink="/">
    <img src="../assets/images/logo-03.png" width="150px" alt="Company Logo">
  </a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNavDropdown">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link" routerLink="/" [routerLinkActiveOptions]="{exact: true}">Home</a>
      </li>
      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link" routerLink="/members">Members</a>
      </li>
      <li class="nav-item" *ngIf="isUserLoggedIn" routerLinkActive="active">
        <a class="nav-link" routerLink="/profile">Profile</a>
      </li>
      <!-- Removed About and Contact Us for now as they are not part of this task -->
    </ul>
    <ul class="navbar-nav">
      <li class="nav-item" *ngIf="isUserLoggedIn">
        <button class="btn btn-link nav-link" (click)="logout()">Logout</button>
      </li>
    </ul>
  </div>
</nav>

<!--common routerOutLet start Here-->
<div class="BasicDiv"> 
  <router-outlet></router-outlet>
</div>
<!--common routerOutLet ends Here-->

</body>
</html>
